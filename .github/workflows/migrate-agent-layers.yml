name: Migrate Marionette and Phantom
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Import pinned source trees through GitHub Git Data API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execFileSync } = require('node:child_process');
            const fs = require('node:fs');
            const path = require('node:path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedReadmeSha = '2d5a80dc566b39c9bd8f3e1a5621ec394798be44';
            const sources = [
              { key: 'marionette', repo: 'Marionette', prefix: 'marionette', sha: '1f058aa292cf7cf82e4db34cd1e6e7bb521da770' },
              { key: 'phantom', repo: 'Phantom', prefix: 'phantom', sha: '48a61a9a9317e50dc4d5ed522151058c6a2df158' },
            ];
            const repoInfo = await github.rest.repos.get({ owner, repo });
            if (!repoInfo.data.private) throw new Error('Destination repository is not private; refusing to proceed.');
            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const headSha = ref.data.object.sha;
            const head = await github.rest.git.getCommit({ owner, repo, commit_sha: headSha });
            const baseTreeSha = head.data.tree.sha;
            const baseTree = await github.rest.git.getTree({ owner, repo, tree_sha: baseTreeSha, recursive: 'true' });
            if (baseTree.data.truncated) throw new Error('Destination tree inventory is truncated.');
            const readme = baseTree.data.tree.find(e => e.path === 'README.md');
            if (!readme || readme.sha !== expectedReadmeSha) throw new Error(`README.md SHA mismatch: ${readme && readme.sha}`);
            for (const prefix of ['marionette/', 'phantom/']) {
              if (baseTree.data.tree.some(e => e.path.startsWith(prefix))) throw new Error(`Destination path already exists: ${prefix}`);
            }
            if (baseTree.data.tree.some(e => e.path === 'NOTICE.md')) throw new Error('NOTICE.md already exists; refusing to overwrite it.');
            const imported = [];
            const gitlinks = [];
            const sourceBlobCache = new Map();
            for (const source of sources) {
              const local = path.join(process.env.RUNNER_TEMP, source.key);
              execFileSync('git', ['clone', '--quiet', '--depth=1', '--branch', 'main', `https://github.com/youneslaaroussi/${source.repo}.git`, local], {
                stdio: 'inherit', env: { ...process.env, GIT_LFS_SKIP_SMUDGE: '1' }
              });
              const clonedSha = execFileSync('git', ['-C', local, 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
              if (clonedSha !== source.sha) throw new Error(`${source.repo} main moved: expected ${source.sha}, got ${clonedSha}`);
              const listing = execFileSync('git', ['-C', local, 'ls-tree', '-r', '-z', '--full-tree', source.sha], { maxBuffer: 64 * 1024 * 1024 });
              const rows = listing.toString('utf8').split('\0').filter(Boolean).map(record => {
                const tab = record.indexOf('\t');
                const [mode, type, sha] = record.slice(0, tab).split(' ');
                return { mode, type, sha, path: record.slice(tab + 1) };
              });
              const blobShas = [...new Set(rows.filter(r => r.type === 'blob').map(r => r.sha).filter(sha => !sourceBlobCache.has(sha)))];
              for (let offset = 0; offset < blobShas.length; offset += 30) {
                const batch = blobShas.slice(offset, offset + 30);
                const raw = execFileSync('git', ['-C', local, 'cat-file', '--batch'], {
                  input: `${batch.join('\n')}\n`, maxBuffer: 256 * 1024 * 1024
                });
                const contentBySha = new Map();
                let cursor = 0;
                while (cursor < raw.length) {
                  const newline = raw.indexOf(10, cursor);
                  if (newline < 0) throw new Error('Malformed git cat-file batch header.');
                  const [sha, kind, sizeText] = raw.subarray(cursor, newline).toString('utf8').split(' ');
                  if (kind !== 'blob') throw new Error(`Expected blob ${sha}, got ${kind}`);
                  const size = Number(sizeText);
                  const start = newline + 1;
                  const end = start + size;
                  if (!Number.isSafeInteger(size) || end >= raw.length || raw[end] !== 10) throw new Error(`Malformed git cat-file content for ${sha}`);
                  contentBySha.set(sha, raw.subarray(start, end));
                  cursor = end + 1;
                }
                let next = 0;
                await Promise.all(Array.from({ length: 4 }, async () => {
                  while (next < batch.length) {
                    const sha = batch[next++];
                    const bytes = contentBySha.get(sha);
                    if (!bytes) throw new Error(`Missing source blob ${sha}`);
                    const created = await github.rest.git.createBlob({ owner, repo, content: bytes.toString('base64'), encoding: 'base64' });
                    sourceBlobCache.set(sha, created.data.sha);
                  }
                }));
              }
              for (const row of rows) {
                if (row.type === 'blob') {
                  imported.push({ path: `${source.prefix}/${row.path}`, mode: row.mode, type: 'blob', sha: sourceBlobCache.get(row.sha) });
                } else if (row.type === 'commit') {
                  gitlinks.push({ path: `${source.prefix}/${row.path}`, mode: row.mode, type: 'commit', sha: row.sha });
                } else {
                  throw new Error(`Unexpected source entry type ${row.type} at ${row.path}`);
                }
              }
              core.info(`${source.repo}: inventoried ${rows.length} tracked entries at ${source.sha}`);
            }
            const noticeText = 'Agent layer (Marionette, Phantom) from youneslaaroussi (https://github.com/youneslaaroussi/Marionette, https://github.com/youneslaaroussi/Phantom), MIT licensed, integrated for the PayPal ATN autonomous-commerce platform.';
            const noticeBlob = await github.rest.git.createBlob({ owner, repo, content: noticeText, encoding: 'utf-8' });
            const entries = [
              ...imported,
              ...gitlinks,
              { path: 'NOTICE.md', mode: '100644', type: 'blob', sha: noticeBlob.data.sha },
              { path: '.github/workflows/migrate-agent-layers.yml', mode: '100644', type: 'blob', sha: null },
            ];
            const tree = await github.rest.git.createTree({ owner, repo, base_tree: baseTreeSha, tree: entries });
            const commit = await github.rest.git.createCommit({ owner, repo, message: 'Import Marionette and Phantom agent layers', tree: tree.data.sha, parents: [headSha] });
            const latestRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (latestRef.data.object.sha !== headSha) throw new Error('Destination main changed during import; not advancing the ref.');
            await github.rest.git.updateRef({ owner, repo, ref: 'heads/main', sha: commit.data.sha, force: false });
            const verified = await github.rest.git.getTree({ owner, repo, tree_sha: tree.data.sha, recursive: 'true' });
            if (verified.data.truncated) throw new Error('Post-commit tree inventory is truncated.');
            const actual = new Map(verified.data.tree.filter(e => e.type === 'blob' || e.type === 'commit').map(e => [e.path, e]));
            const expected = [...imported, ...gitlinks];
            for (const e of expected) {
              const found = actual.get(e.path);
              if (!found || found.sha !== e.sha || found.mode !== e.mode || found.type !== e.type) throw new Error(`Post-commit verification failed for ${e.path}`);
            }
            for (const prefix of ['marionette/', 'phantom/']) {
              const actualPaths = [...actual.keys()].filter(p => p.startsWith(prefix));
              const expectedPaths = expected.filter(e => e.path.startsWith(prefix)).map(e => e.path);
              if (actualPaths.length !== expectedPaths.length) throw new Error(`Inventory count mismatch under ${prefix}: ${actualPaths.length} vs ${expectedPaths.length}`);
            }
            if (actual.get('NOTICE.md')?.sha !== noticeBlob.data.sha) throw new Error('NOTICE.md verification failed.');
            if (actual.get('README.md')?.sha !== expectedReadmeSha) throw new Error('README.md changed during migration.');
            if (actual.has('.github/workflows/migrate-agent-layers.yml')) throw new Error('Temporary workflow was not removed.');
            const finalRepo = await github.rest.repos.get({ owner, repo });
            if (!finalRepo.data.private) throw new Error('Destination repository privacy check failed.');
            core.info(`Migration committed and verified: ${commit.data.sha}; Marionette files=${expected.filter(e => e.path.startsWith('marionette/')).length}, Phantom files=${expected.filter(e => e.path.startsWith('phantom/')).length}; README SHA preserved; destination private.`);