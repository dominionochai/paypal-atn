name: ATN CI
on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: atn
      - run: npm run typecheck --if-present
        if: always()
        working-directory: atn
      - run: npm test --if-present
        continue-on-error: false
        working-directory: atn
