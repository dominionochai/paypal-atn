name: One-time Marionette and Phantom migration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Capture README identity
        run: git rev-parse HEAD:README.md > "$RUNNER_TEMP/readme-before"
      - name: Clone, copy, and validate source trees
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/youneslaaroussi/Marionette.git "$RUNNER_TEMP/Marionette"
          git clone --depth 1 --branch main https://github.com/youneslaaroussi/Phantom.git "$RUNNER_TEMP/Phantom"
          echo "Marionette source commit: $(git -C "$RUNNER_TEMP/Marionette" rev-parse HEAD)"
          echo "Phantom source commit: $(git -C "$RUNNER_TEMP/Phantom" rev-parse HEAD)"
          rm -rf marionette phantom
          mkdir -p marionette phantom
          rsync -a --exclude='.git' "$RUNNER_TEMP/Marionette/" marionette/
          rsync -a --exclude='.git' "$RUNNER_TEMP/Phantom/" phantom/
          cat > NOTICE.md <<'NOTICE'
          Agent layer (Marionette, Phantom) from youneslaaroussi (https://github.com/youneslaaroussi/Marionette, https://github.com/youneslaaroussi/Phantom), MIT licensed, integrated for the PayPal ATN autonomous-commerce platform.
          NOTICE
          python3 - "$RUNNER_TEMP/Marionette" marionette "$RUNNER_TEMP/Phantom" phantom <<'PY'
          import os
          import sys

          def inventory(root):
              result = set()
              for current, dirs, files in os.walk(root, topdown=True, followlinks=False):
                  dirs[:] = [name for name in dirs if name != '.git']
                  rel_dir = os.path.relpath(current, root)
                  for name in dirs + [name for name in files if name != '.git']:
                      rel = name if rel_dir == '.' else os.path.join(rel_dir, name)
                      result.add(rel.replace(os.sep, '/'))
              return result

          for source, destination in ((sys.argv[1], sys.argv[2]), (sys.argv[3], sys.argv[4])):
              expected, actual = inventory(source), inventory(destination)
              if expected != actual:
                  print(f'Inventory mismatch for {destination}: missing={sorted(expected-actual)}, extra={sorted(actual-expected)}', file=sys.stderr)
                  raise SystemExit(1)
              print(f'{destination}: {len(actual)} paths verified')
          PY
          before=$(cat "$RUNNER_TEMP/readme-before")
          after=$(git rev-parse HEAD:README.md)
          test "$before" = "$after"
          printf 'README blob unchanged before staging: %s\n' "$after"
      - name: Commit and push migration content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- marionette phantom NOTICE.md
          git commit -m 'Migrate Marionette and Phantom source trees'
          before=$(cat "$RUNNER_TEMP/readme-before")
          after=$(git rev-parse HEAD:README.md)
          test "$before" = "$after"
          git push origin HEAD:main
          echo "Migration commit: $(git rev-parse HEAD)"
          echo "README blob after migration: $after"
